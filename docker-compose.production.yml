# Production Docker Compose Configuration
version: '3.8'

services:
  # Backend API Service
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: coop-match-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - PORT=8080
      - CORS_ORIGIN=https://coop-match.online
      - API_BASE_URL=https://api.coop-match.online
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      # SMTP Configuration
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=coopmatch4@gmail.com
      - SMTP_PASSWORD=gbje dwdb dchl zcyx
      - FROM_EMAIL=coopmatch4@gmail.com
      - DEV_SMTP_INSECURE=false
    volumes:
      - ./backend/co-op-match.db:/app/co-op-match.db
      - ./backend/public:/app/public
      - ./backend/uploads:/app/uploads
    networks:
      - coop-match-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web Service  
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://api.coop-match.online
        - VITE_ASSET_BASE_URL=https://api.coop-match.online
        - VITE_ENVIRONMENT=production
    container_name: coop-match-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - coop-match-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reverse Proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: coop-match-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL certificates
    depends_on:
      - api
      - web
    networks:
      - coop-match-network

networks:
  coop-match-network:
    driver: bridge

volumes:
  db_data:
    driver: local