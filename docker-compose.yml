
services:
  api:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      - GIN_MODE=release
      - DB_DIALECT=sqlite
      - DB_PATH=/app/data/app.db
      - CORS_ORIGIN=http://localhost:5173
    # ผูกโวลุ่ม (ถ้าอยากเก็บ DB ระหว่าง restart)
    volumes:
      - ./backend/db:/app/data

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8080"
    ports: ["5173:8080"]
    depends_on: [api]
