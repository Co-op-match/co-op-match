name: Build & Deploy (Backend & Frontend via Docker Hub → Cloud Run)

on:
  push:
    branches: [ deploy ]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  TAG: ${{ github.sha }}
  DH_BACKEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/co-op-match-api
  DH_FRONTEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/coop-frontend

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
      - name: Debug filter outputs
        run: |
          echo "backend=${{ steps.filter.outputs.backend }}"
          echo "frontend=${{ steps.filter.outputs.frontend }}"

  deploy-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # ----- Build & Push Backend -----
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.DH_BACKEND_IMAGE }}:${{ env.TAG }}
            ${{ env.DH_BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- Auth GCP (WIF) -----
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Sanity check GCP auth (BE)
        run: |
          gcloud auth list
          gcloud config set project ${{ vars.GCP_PROJECT_ID }}
          gcloud auth print-access-token >/dev/null && echo "OK minted token"

      # ----- Deploy Backend -----
      - name: Deploy Backend to Cloud Run
        run: |
          gcloud config set project ${{ vars.GCP_PROJECT_ID }}
          gcloud run deploy ${{ vars.BACKEND_SERVICE }} \
            --image ${{ env.DH_BACKEND_IMAGE }}:${{ env.TAG }} \
            --region  ${{ vars.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port ${{ vars.BACKEND_PORT }} \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 80 \
            --set-env-vars GIN_MODE=release,DB_DIALECT=sqlite,DB_PATH=/app/data/app.db,DATA_DIR=/app/config,UPLOAD_DIR=/app/public/uploads,TZ=Asia/Bangkok \
            --quiet

      - name: Tail Cloud Run logs (BE) on failure
        if: failure()
        run: |
          gcloud run services logs read ${{ vars.BACKEND_SERVICE }} \
            --region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT_ID }} \
            --limit 200 || true

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # ----- Build & Push Frontend -----
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.DH_FRONTEND_IMAGE }}:${{ env.TAG }}
            ${{ env.DH_FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- Auth GCP (WIF) -----
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Sanity check GCP auth (FE)
        run: |
          gcloud auth list
          gcloud config set project ${{ vars.GCP_PROJECT_ID }}
          gcloud auth print-access-token >/dev/null && echo "OK minted token"

      # ----- Deploy Frontend -----
      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud config set project ${{ vars.GCP_PROJECT_ID }}
          gcloud run deploy ${{ vars.FRONTEND_SERVICE }} \
            --image ${{ env.DH_FRONTEND_IMAGE }}:${{ env.TAG }} \
            --region  ${{ vars.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port ${{ vars.FRONTEND_PORT }} \
            --memory 256Mi \
            --cpu 1 \
            --concurrency 200 \
            --quiet

      - name: Tail Cloud Run logs (FE) on failure
        if: failure()
        run: |
          gcloud run services logs read ${{ vars.FRONTEND_SERVICE }} \
            --region ${{ vars.GCP_REGION }} --project ${{ vars.GCP_PROJECT_ID }} \
            --limit 200 || true
