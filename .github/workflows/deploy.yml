name: Build & Deploy Backend (Docker Hub → Cloud Run)

on:
  push:
    branches: [ deploy ]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  TAG: ${{ github.sha }}
  DH_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/co-op-match-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.DH_IMAGE }}:${{ env.TAG }}
            ${{ env.DH_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ vars.BACKEND_SERVICE }} \
            --image ${{ env.DH_IMAGE }}:${{ env.TAG }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region  ${{ vars.GCP_REGION }} \
            --allow-unauthenticated \
            --port ${{ vars.BACKEND_PORT }} \
            --memory 512Mi \
            --max-instances 1 \
            --set-env-vars GIN_MODE=release,DB_DIALECT=sqlite,DB_PATH=/app/data/app.db,DATA_DIR=/app/config,UPLOAD_DIR=/app/public/uploads
